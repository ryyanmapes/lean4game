<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Lean Game Server</title>
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Liberation Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
    }
  </style>
</head>

<body>
  <script>
    // Paint a game's stored light theme straight away, so reloading it doesn't
    // flash dark while the app loads. See `gameLightModeKey`.
    try {
      const game = /\bg\/[^/#?]+\/[^/#?]+/.exec(location.pathname + location.hash)
      if (game && localStorage.getItem('visual_light_mode/' + game[0]) === 'true') {
        document.documentElement.style.backgroundColor = '#f8fafc'
        document.documentElement.style.colorScheme = 'light'
        document.body.style.backgroundColor = '#f8fafc'
      }
    } catch {}
  </script>
  <div id="root"></div>
  <noscript>
    <div class="landing-page">
      <h1>Lean Game Server</h1>
      <p>
        <i>You need to enable JavaScript to use the Lean Game Server, as it is built
        using React.</i>

</body>
