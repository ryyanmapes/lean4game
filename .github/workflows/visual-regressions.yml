name: Focused visual regressions
run-name: Focused Visual Lean player regressions

on:
  workflow_dispatch:

concurrency:
  group: focused-visual-regressions-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: 25

jobs:
  player-regressions:
    name: Linux - ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: implication and theorem display
            id: implication-display
            specs: cypress/e2e/nng4-implication-and-display-regressions.cy.ts,cypress/e2e/visual-mobile-theorem-regressions.cy.ts
          - name: lesson loading and guidance
            id: lesson-guidance
            specs: cypress/e2e/visual-loading-and-implication-guides.cy.ts
          - name: mobile transformation pagination
            id: mobile-pagination
            specs: cypress/e2e/visual-mobile-pagination-stability.cy.ts
          - name: Advanced Addition 5 playthrough
            id: advanced-addition-5
            specs: cypress/e2e/nng4-visual-complete-playthrough.cy.ts
    steps:
      - uses: actions/checkout@v4

      - name: Checkout NNG4
        run: git clone https://github.com/ryyanmapes/NNG4 ../NNG4

      - name: Record NNG4 revision
        id: nng4-revision
        run: echo "sha=$(git -C ../NNG4 rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Lean
        uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
          check-reservoir-eligibility: false
          lake-package-directory: server

      - run: elan default stable

      - name: Cache compiled NNG4 game
        uses: actions/cache@v4
        with:
          path: ../NNG4/.lake/build
          key: focused-nng4-${{ runner.os }}-${{ steps.nng4-revision.outputs.sha }}

      - name: Install JavaScript dependencies and build relay
        run: |
          npm ci
          npm run build:relay

      - name: Build NNG4 game
        working-directory: ../NNG4
        run: |
          lake exe cache get
          lake build
          test -s .lake/gamedata/game.json

      - name: Run focused player regressions
        timeout-minutes: 15
        env:
          CYPRESS_READY_PATHS: /,/data/g/local/NNG4/game.json
          CYPRESS_VISUAL_TIMEOUT: '120000'
          CYPRESS_VISUAL_WORLD: AdvAddition
          CYPRESS_VISUAL_LEVEL: '5'
          CYPRESS_VISUAL_REGRESSION: 'zero-ne-one,zero-ne-succ,specializes collision-renamed binders,shows the definitionally expanded form,shows the requested level lesson labels,keeps the less-or-equal construction lesson,renders the induction octagon,renders cases as an octagonal,uses the wider phone world-map,renders a revisited completed goal'
        run: |
          npx concurrently -n server,cypress -c blue,green \
            "npm start" "node scripts/run-cypress-ready.cjs run --spec ${{ matrix.specs }} --browser electron" \
            -k -s first --hide server

      - name: Upload focused regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focused-visual-regression-${{ github.run_id }}-${{ matrix.id }}
          path: |
            cypress/results/*.json
            cypress/screenshots/**
          if-no-files-found: warn
          retention-days: 14
