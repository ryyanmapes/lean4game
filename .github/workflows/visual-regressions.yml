name: Focused visual regressions
run-name: Focused Visual Lean player regressions

on:
  workflow_dispatch:

concurrency:
  group: focused-visual-regressions-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: 25

jobs:
  player-regressions:
    name: Linux - ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: implication and theorem display
            id: implication-display
            specs: cypress/e2e/nng4-implication-and-display-regressions.cy.ts,cypress/e2e/visual-mobile-theorem-regressions.cy.ts
          - name: lesson loading and guidance
            id: lesson-guidance
            specs: cypress/e2e/visual-loading-and-implication-guides.cy.ts,cypress/e2e/nng4-less-or-equal-total-goal-choice.cy.ts
          - name: mobile transformation pagination
            id: mobile-pagination
            specs: cypress/e2e/visual-mobile-pagination-stability.cy.ts
          - name: Addition 1 completed-branch rewrite
            id: addition-1-branch-order
            specs: cypress/e2e/nng4-induction-transform.cy.ts
          - name: feedback and release contracts
            id: feedback-release
            specs: cypress/e2e/feedback-report.cy.ts
          - name: Addition 1 player canary
            id: addition-1
            specs: cypress/e2e/nng4-visual-complete-playthrough.cy.ts
            world: Addition
            level: '1'
          - name: premise application player canary
            id: premise-application
            specs: cypress/e2e/nng4-visual-complete-playthrough.cy.ts
            world: AdvAddition
            level: '1'
          - name: all levels 1 of 8
            id: all-levels-0
            specs: cypress/e2e/nng4-visual-complete-playthrough.cy.ts
            shard_index: '0'
            shard_total: '8'
          - name: all levels 2 of 8
            id: all-levels-1
            specs: cypress/e2e/nng4-visual-complete-playthrough.cy.ts
            shard_index: '1'
            shard_total: '8'
          - name: all levels 3 of 8
            id: all-levels-2
            specs: cypress/e2e/nng4-visual-complete-playthrough.cy.ts
            shard_index: '2'
            shard_total: '8'
          - name: all levels 4 of 8
            id: all-levels-3
            specs: cypress/e2e/nng4-visual-complete-playthrough.cy.ts
            shard_index: '3'
            shard_total: '8'
          - name: all levels 5 of 8
            id: all-levels-4
            specs: cypress/e2e/nng4-visual-complete-playthrough.cy.ts
            shard_index: '4'
            shard_total: '8'
          - name: all levels 6 of 8
            id: all-levels-5
            specs: cypress/e2e/nng4-visual-complete-playthrough.cy.ts
            shard_index: '5'
            shard_total: '8'
          - name: all levels 7 of 8
            id: all-levels-6
            specs: cypress/e2e/nng4-visual-complete-playthrough.cy.ts
            shard_index: '6'
            shard_total: '8'
          - name: all levels 8 of 8
            id: all-levels-7
            specs: cypress/e2e/nng4-visual-complete-playthrough.cy.ts
            shard_index: '7'
            shard_total: '8'
    steps:
      - uses: actions/checkout@v4

      - name: Checkout NNG4
        run: git clone https://github.com/ryyanmapes/NNG4 ../NNG4

      - name: Record NNG4 revision
        id: nng4-revision
        run: echo "sha=$(git -C ../NNG4 rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Lean
        uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
          check-reservoir-eligibility: false
          lake-package-directory: server

      - run: elan default stable

      - name: Cache compiled NNG4 game
        uses: actions/cache@v4
        with:
          path: ../NNG4/.lake/build
          # NNG4's build imports this checkout's GameServer sources. Keying
          # only on NNG4 restored stale tactic oleans after lean4game backend
          # changes, so CI (and downstream browser releases) could test old
          # semantics while the client came from the new commit.
          key: focused-nng4-${{ runner.os }}-${{ steps.nng4-revision.outputs.sha }}-${{ hashFiles('server/**/*.lean', 'server/lakefile.lean', 'server/lean-toolchain') }}

      - name: Install JavaScript dependencies and build relay
        run: |
          npm ci
          npm run build:relay

      - name: Build NNG4 game
        working-directory: ../NNG4
        run: |
          lake exe cache get
          lake build
          test -s .lake/gamedata/game.json

      - name: Run focused player regressions
        timeout-minutes: 45
        env:
          CYPRESS_READY_PATHS: /,/data/g/local/NNG4/game.json
          CYPRESS_LEAN4GAME_MOUNT: /
          # Some reference commands such as `repeat apply succ_inj at h` map
          # to several deliberate player drags, each followed by a Lean WASM
          # response and React stream reconciliation. Keep the enclosing
          # Cypress callback above that complete gesture sequence; the driver
          # retains its shorter per-interaction diagnostics.
          CYPRESS_VISUAL_TIMEOUT: '600000'
          CYPRESS_VISUAL_WORLD: ${{ matrix.world }}
          CYPRESS_VISUAL_LEVEL: ${{ matrix.level }}
          CYPRESS_VISUAL_SHARD_INDEX: ${{ matrix.shard_index }}
          CYPRESS_VISUAL_SHARD_TOTAL: ${{ matrix.shard_total }}
          # Each matrix entry already selects a focused spec (or an explicit
          # all-level shard). Do not apply the old title substring filter here:
          # it silently skipped most tests in the implication and mobile specs
          # while still reporting their matrix job as green.
        run: |
          node scripts/generate-nng4-visual-solutions.mjs
          npx concurrently -n server,cypress -c blue,green \
            "npm start" "node scripts/run-cypress-ready.cjs run --spec ${{ matrix.specs }} --browser electron" \
            -k -s first --hide server

      - name: Upload focused regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focused-visual-regression-${{ github.run_id }}-${{ matrix.id }}
          path: |
            cypress/results/*.json
            cypress/screenshots/**
          if-no-files-found: warn
          retention-days: 14
